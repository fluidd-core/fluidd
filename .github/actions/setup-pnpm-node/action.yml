name: Setup pnpm and Node
description: Puts pnpm on PATH, then sets up Node using .node-version with the pnpm store cached.

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        run_install: false

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: 'pnpm'

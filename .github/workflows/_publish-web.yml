name: Publish Web (Reusable)

on:
  workflow_call:
    secrets:
      bucket:
        description: S3 bucket name to deploy to
        required: true
      distribution-id:
        description: CloudFront distribution id to invalidate
        required: true
      aws-role:
        description: ARN of the AWS role to assume via OIDC
        required: true

permissions: {}

jobs:
  publish-web:
    name: Deploy to Host
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download fluidd dist
        uses: actions/download-artifact@v8
        with:
          name: fluidd-${{ github.sha }}
          path: ./dist

      - name: Prepare Deploy
        run: |
          cp ./server/config.json ./dist/config.json

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.aws-role }}

      - name: Deploy to Host
        env:
          BUCKET: ${{ secrets.bucket }}
          DIST_ID: ${{ secrets.distribution-id }}
        run: |
          aws s3 sync ./dist "s3://${BUCKET}" --delete --cache-control no-cache
          aws cloudfront create-invalidation --distribution-id "${DIST_ID}" --paths '/*'

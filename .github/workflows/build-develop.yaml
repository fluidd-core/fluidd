# .github/workflows/build-develop.yml
name: Build and Publish Develop Zip

on:
  push:
    branches:
      - develop

permissions:
  contents: write   # needed to create/update GitHub Releases

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --experimental-websocket

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint -- --no-fix

      - name: Run tests
        run: npm run test:unit

      - name: Run circular references check
        run: npm run circular-check

      - name: Build
        run: npm run build

      # (optional) keep the original artifact
      - name: Upload interim dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluidd-${{ github.sha }}.zip
          path: ./dist
          retention-days: 1

      - name: Zip build output
        run: |
          cd dist
          zip -r ../fluidd.zip .

      - name: Publish to “development” Release
        if: ${{ vars.FLUIDD_PAUSE_PUBLISH != 'true' }}
        uses: ncipollo/release-action@v1
        with:
          tag: development
          name: Development build
          body: Automated build of develop at commit ${{ github.sha }}
          artifacts: ./fluidd.zip          # tell the action exactly what to upload :contentReference[oaicite:0]{index=0}:contentReference[oaicite:1]{index=1}
          allowUpdates: true               # replace the old asset if the Release already exists :contentReference[oaicite:2]{index=2}
          token: ${{ secrets.GITHUB_TOKEN }}  
          draft: false
          prerelease: true

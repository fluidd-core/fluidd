name: BUILD

on:
  push:
    branches:
      - develop
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
      - master

# A new push to the same PR or branch supersedes the old run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The upstream "Publish Docker Image" (GHCR) and "Deploy to Host" (S3 and
# CloudFront) jobs were removed (KAN-915): this fork has neither the GHCR
# package permission nor the AWS role, so both failed on every develop push.
# The fork publishes through build-develop.yaml and printer-zip.yaml instead.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --experimental-websocket
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Run lint
        run: |
          npm run lint -- --no-fix

      - name: Run type check
        run: |
          npm run type-check

      - name: Run tests
        run: |
          npm run test:unit

      - name: Run circular references check
        run: |
          npm run circular-check

      - name: Build
        run: |
          npm run build

      - name: Check the /setup page budget
        run: |
          npm run check:setup-budget

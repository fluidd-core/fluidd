name: BUILD

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    name: Build
    uses: ./.github/workflows/_build.yml
    with:
      artifact-name: fluidd-${{ github.sha }}
    permissions:
      contents: read

  publish-docker:
    name: Publish
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    uses: ./.github/workflows/_publish-docker.yml
    with:
      artifact-name: fluidd-${{ github.sha }}
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write

  publish-web:
    name: Deploy to Host
    needs: build
    if: ${{ github.repository == 'fluidd-core/fluidd' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download fluidd dist
        uses: actions/download-artifact@v8
        with:
          name: fluidd-${{ github.sha }}
          path: ./dist

      - name: Prepare Deploy
        run: |
          cp ./server/config.json ./dist/config.json

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}

      - name: Deploy to Host
        env:
          BUCKET: ${{ secrets.DEV_S3_BUCKET_NAME }}
          DIST_ID: ${{ secrets.DEV_CF_DISTRIBUTION_ID }}
        run: |
          aws s3 sync ./dist "s3://${BUCKET}" --delete --cache-control no-cache
          aws cloudfront create-invalidation --distribution-id "${DIST_ID}" --paths '/*'

  bundle-baseline:
    name: Save Bundle Size Baseline
    needs: build
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: tools

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: fluidd-${{ github.sha }}
          path: ./dist

      - name: Generate bundle size manifest
        run: node tools/bundle-size.mjs generate dist bundle-size.json

      - name: Cache bundle size manifest
        uses: actions/cache/save@v4
        with:
          path: bundle-size.json
          key: bundle-size-${{ github.sha }}

  bundle-size:
    name: Bundle Size Report
    needs: build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm i --frozen-lockfile

      - name: Resolve merge-base
        id: mb
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          echo "sha=$(git merge-base "origin/$BASE_REF" HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore bundle size baseline
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: bundle-size.base.json
          key: bundle-size-${{ steps.mb.outputs.sha }}

      - name: Build merge-base
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        env:
          MERGE_BASE: ${{ steps.mb.outputs.sha }}
        run: |
          git worktree add ../base "$MERGE_BASE"
          cd ../base
          pnpm i --frozen-lockfile
          pnpm run build
          node "$GITHUB_WORKSPACE/tools/bundle-size.mjs" generate dist "$GITHUB_WORKSPACE/bundle-size.base.json"

      - name: Save bundle size baseline
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: bundle-size.base.json
          key: bundle-size-${{ steps.mb.outputs.sha }}

      - name: Download PR dist
        uses: actions/download-artifact@v8
        with:
          name: fluidd-${{ github.sha }}
          path: ./dist

      - name: Generate PR bundle size manifest
        run: |
          node tools/bundle-size.mjs generate dist bundle-size.head.json

      - name: Compare bundle sizes
        run: |
          node tools/bundle-size.mjs compare bundle-size.base.json bundle-size.head.json | tee bundle-size-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Write PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "$PR_NUMBER" > pr-number.txt

      - name: Build treemap
        continue-on-error: true
        run: |
          pnpm run build:analyze

      - name: Upload bundle size report
        uses: actions/upload-artifact@v7
        with:
          name: bundle-size-report
          path: |
            bundle-size-report.md
            pr-number.txt
            .analyze/stats.html
          retention-days: 7
          if-no-files-found: ignore

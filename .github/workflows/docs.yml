name: Deploy Docs

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - master
      - develop
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # markdownlint runs through `pnpm dlx`: npm refuses to run inside this
      # repo, since `devEngines.packageManager` names pnpm (EBADDEVENGINES).
      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-pnpm-node

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Lint docs
        run: |
          codespell docs/docs/
          pnpm dlx markdownlint-cli@0.49.1 --config docs/.markdownlint.json docs/docs/

      - name: Build docs
        run: zensical build --clean --strict
        working-directory: docs

      - uses: actions/upload-pages-artifact@v5
        if: ${{ github.event_name != 'pull_request' }}
        with:
          path: docs/site

  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - id: deployment
        uses: actions/deploy-pages@v5

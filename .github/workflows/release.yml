name: RELEASE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions: {}

jobs:
  build:
    name: Build
    uses: ./.github/workflows/_build.yml
    with:
      artifact-name: fluidd-${{ github.sha }}
    permissions:
      contents: read

  publish-docker:
    name: Publish
    needs: build
    uses: ./.github/workflows/_publish-docker.yml
    with:
      artifact-name: fluidd-${{ github.sha }}
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download fluidd dist
        uses: actions/download-artifact@v8
        with:
          name: fluidd-${{ github.sha }}
          path: ./dist

      - name: Create Artifact
        run: |
          cd ./dist
          zip -r ../fluidd.zip ./

      - name: Attest fluidd.zip
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ./fluidd.zip

      - name: Get version from tag
        id: tag_name
        run: |
          echo "current_version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Read ChangeLog
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        id: changelog
        with:
          validation_depth: 1
          version: ${{ steps.tag_name.outputs.current_version }}
          path: ./CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ steps.tag_name.outputs.current_version }}
          body: ${{ steps.changelog.outputs.changes }}
          files: ./fluidd.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}

  publish-web:
    name: Deploy to Host
    needs: build
    if: ${{ github.repository == 'fluidd-core/fluidd' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download fluidd dist
        uses: actions/download-artifact@v8
        with:
          name: fluidd-${{ github.sha }}
          path: ./dist

      - name: Prepare Deploy
        run: |
          cp ./server/config.json ./dist/config.json

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}

      - name: Deploy to Host
        env:
          BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          DIST_ID: ${{ secrets.CF_DISTRIBUTION_ID }}
        run: |
          aws s3 sync ./dist "s3://${BUCKET}" --delete --cache-control no-cache
          aws cloudfront create-invalidation --distribution-id "${DIST_ID}" --paths '/*'

[project]
site_name = "Fluidd"
site_url = "https://docs.fluidd.xyz"
site_description = "A web interface for Klipper 3D printer firmware"
copyright = "&copy; Fluidd 2026"
repo_url = "https://github.com/fluidd-core/fluidd"
repo_name = "fluidd-core/fluidd"
edit_uri = "edit/master/docs/docs/"
site_dir = "site"
extra_css = [
  "stylesheets/extra.css"
]

nav = [
  {"Home" = "index.md"},
  {"Getting Started" = "getting-started.md"},
  {"Configuration" = "configuration.md"},
  {"Customize" = "customize.md"},
  {"Features" = [
    "features/index.md",
    "features/authorization.md",
    "features/cameras.md",
    "features/console.md",
    "features/diagnostics.md",
    "features/file-editor.md",
    "features/file-manager.md",
    "features/job-queue.md",
    "features/keyboard-shortcuts.md",
    "features/localization.md",
    "features/macros.md",
    "features/multi-material.md",
    "features/multiple-printers.md",
    "features/printing.md",
    "features/slicer-uploads.md",
    "features/system-and-notifications.md",
    "features/thermals.md",
    "features/third-party-integrations.md",
    "features/timelapse.md",
    "features/updates.md"
  ]},
  {"Development" = "development.md"},
  {"FAQ" = "faq.md"},
  {"Sponsors" = "sponsors.md"}
]

[project.theme]
variant = "modern"
logo = "assets/images/fluidd_icon.svg"
favicon = "favicon.ico"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.preview",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "toc.follow"
]
custom_dir = "overrides"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# NOTE: declaring this table replaces Zensical's DEFAULT_MARKDOWN_EXTENSIONS
# wholesale (it is a `config.get(...)`, not a merge), so it has to restate the
# defaults we want. Keep it in sync with zensical/bootstrap/zensical.toml.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
"pymdownx.betterem" = {}
"pymdownx.caret" = {}
"pymdownx.details" = {}
"pymdownx.emoji".emoji_generator = "zensical.extensions.emoji.to_svg"
"pymdownx.emoji".emoji_index = "zensical.extensions.emoji.twemoji"
"pymdownx.highlight".anchor_linenums = true
"pymdownx.highlight".line_spans = "__span"
"pymdownx.highlight".pygments_lang_class = true
"pymdownx.inlinehilite" = {}
"pymdownx.keys" = {}
"pymdownx.magiclink" = {}
"pymdownx.mark" = {}
"pymdownx.smartsymbols" = {}
"pymdownx.snippets".auto_append = ["includes/glossary.md"]
"pymdownx.superfences".custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
"pymdownx.tabbed".alternate_style = true
"pymdownx.tabbed".combine_header_slug = true
"pymdownx.tabbed".slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
"pymdownx.tasklist".custom_checkbox = true
"pymdownx.tilde" = {}

[project.plugins.glightbox]

[project.plugins.minify]
minify_html = true
minify_js = true
minify_css = true

[project.plugins.redirects.redirect_maps]
# Installation -> Getting Started
"installation/index.md" = "getting-started.md"
"installation/kiauh.md" = "getting-started.md#kiauh"
"installation/docker.md" = "getting-started.md#docker"
"installation/manual.md" = "getting-started.md#manual-installation"
"installation/fluiddpi.md" = "getting-started.md#fluiddpi"

# Configuration
"configuration/initial_setup.md" = "configuration.md#initial-setup"
"configuration/required.md" = "configuration.md#initial-setup"
"configuration/moonraker.md" = "configuration.md#moonraker"

# Development
"development/localization.md" = "development.md#localization"
# Corepack dropped in favour of pnpm's own installer — heading renamed
"development.md#enable-pnpm" = "development.md#install-pnpm"

# Per-slicer / per-sensor sections became content tabs — preserve the anchors
# of the headings they replaced (anchor redirects, Zensical 0.0.61+)
"features/printing.md#orcaslicer" = "features/printing.md#thumbnails-orcaslicer"
"features/printing.md#prusaslicer-230" = "features/printing.md#thumbnails-prusaslicer--superslicer"
"features/printing.md#prusaslicer-220-and-below" = "features/printing.md#thumbnails-prusaslicer--superslicer"

version: '3.8'

services:
  fluidd:
    build:
      context: ./
    volumes:
      - ..:/workspaces/fluidd/:cached
      - pnpm-store:/home/node/.local/share/pnpm/store
    command: sleep infinity
    network_mode: service:klipper-simulavr

  klipper-simulavr:
    image: ei99070/docker-klipper-simulavr:latest
    restart: unless-stopped

volumes:
  pnpm-store:

version: '3.8'

services:
  fluidd:
    # NOTE: must stay on a glibc base. typescript-native-bridge (the `typescript`
    # catalog entry) ships a Go c-shared NAPI bridge with no musl build — on Alpine
    # it fails to load, and segfaults even with `gcompat`. See issue #1938.
    image: mcr.microsoft.com/devcontainers/javascript-node:26
    user: node
    working_dir: /workspaces/fluidd
    volumes:
      - ..:/workspaces/fluidd/:cached
      - node-modules:/workspaces/fluidd/node_modules
    command: sleep infinity
    network_mode: service:klipper-simulavr

  klipper-simulavr:
    image: ei99070/docker-klipper-simulavr:latest
    restart: unless-stopped

volumes:
  node-modules:
